name: Check new version of amml-utils

on:
  workflow_dispatch:
  schedule:
    # Run this job every 4 hours
    - cron: "0 0/4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-tags:
    runs-on: ubuntu-latest
    outputs:
      comparison: ${{ steps.compare-versions.outputs.comparison-result }}
      new: ${{ steps.get-latest-version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: get-latest-version
        name: Get the latest version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: IDeaLab-uni-graz/amml-utils  # The repository to scan.
      - id: get-current-version
        name: Get the currently used version
        run: |
          VER=`grep -oE 'amml-utils.git@[0-9]+.[0-9]+.[0-9]+' slim_requirements.txt | awk -F"@" '{print (NF>1)? $NF : ""}'`
          echo "tag=$VER" >> $GITHUB_OUTPUT
      - uses: madhead/semver-utils@latest
        name: Compare versions
        id: compare-versions
        with:
          version: ${{ steps.get-current-version.outputs.tag }}
          compare-to: ${{ steps.get-latest-version.outputs.tag }}
  open-pr:
    runs-on: ubuntu-latest
    needs: fetch-tags
    if: ${{ needs.fetch-tags.outputs.comparison == '<' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Bump amml-utils version in requirements
        env:
          NEW: ${{ needs.fetch-tags.outputs.new }}
        run: |
          sed -i -E "s/(amml-utils\.git@)[0-9]+\.[0-9]+\.[0-9]+/\1${NEW}/" slim_requirements.txt
          if git diff --quiet slim_requirements.txt; then echo "slim_requirements.txt unchanged, version pattern not found"; exit 1; fi
      # A fixed branch name means a newer release updates the already open PR instead of opening another one
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/update-amml-utils
          delete-branch: true
          commit-message: "Update amml-utils to ${{ needs.fetch-tags.outputs.new }}"
          title: "[CI] Update amml-utils to ${{ needs.fetch-tags.outputs.new }}"
          assignees: sceptri
          labels: dependencies
          body: |
            ### New `amml-utils` version

            New version of `amml-utils`, namely ${{ needs.fetch-tags.outputs.new }}, was found and `slim_requirements.txt` was bumped.

            > Note: This PR was generated automatically. Please report any issues to @sceptri.
