name: Check new version of PyTorch

on:
  workflow_dispatch:
  schedule:
    # Run this job every 4 hours
    - cron: "0 0/4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-tags:
    runs-on: ubuntu-latest
    outputs:
      comparison: ${{ steps.compare-versions.outputs.comparison-result }}
      new: ${{ steps.get-latest-version.outputs.latestVersion }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: get-python
        name: Get the currently Python used version
        run: |
          VER=`grep -oE 'PYTHON_VERSION="[0-9.]+' Dockerfile | awk -F"=\"" '{print (NF>1)? $NF : ""}'`
          echo "ver=$VER" >> $GITHUB_OUTPUT
      - uses: Bruce17/ghaction-package-latest-version@v1
        id: get-latest-version
        with:
          package: torch
          language: python
          conditions: |
            pythonVersion: ${{ steps.get-python.outputs.ver }}
      - id: get-current-version
        name: Get the currently used version
        run: |
          VER=`grep -oE 'PYTORCH_VERSION="[0-9]+.[0-9]+.[0-9]+' Dockerfile | awk -F"=\"" '{print (NF>1)? $NF : ""}'`
          echo "tag=$VER" >> $GITHUB_OUTPUT
      - uses: madhead/semver-utils@latest
        name: Compare versions
        id: compare-versions
        with:
          version: ${{ steps.get-current-version.outputs.tag }}
          compare-to: ${{ steps.get-latest-version.outputs.latestVersion }}
  open-pr:
    runs-on: ubuntu-latest
    needs: fetch-tags
    if: ${{ needs.fetch-tags.outputs.comparison == '<' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Bump PyTorch version in Dockerfile
        env:
          NEW: ${{ needs.fetch-tags.outputs.new }}
        run: |
          sed -i -E "s/(ARG PYTORCH_VERSION=\")[0-9.]+\"/\1${NEW}\"/" Dockerfile
          if git diff --quiet Dockerfile; then echo "Dockerfile unchanged, version pattern not found"; exit 1; fi
      # A fixed branch name means a newer release updates the already open PR instead of opening another one
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/update-pytorch
          delete-branch: true
          commit-message: "Update PyTorch to ${{ needs.fetch-tags.outputs.new }}"
          title: "[CI] Update PyTorch to ${{ needs.fetch-tags.outputs.new }}"
          assignees: sceptri
          labels: dependencies
          body: |
            ### New PyTorch version

            New version of `torch`, namely ${{ needs.fetch-tags.outputs.new }}, was found and `PYTORCH_VERSION` in the `Dockerfile` was bumped.

            Do not forget to also update `torch` in [`amml-utils`](https://github.com/IDeaLab-uni-graz/amml-utils/).
            Check that `torchvision` and `CUDA_VERSION` are still compatible before merging.

            > Note: This PR was generated automatically. Please report any issues to @sceptri.
