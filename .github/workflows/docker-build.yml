name: Build and Push Docker Image

on:
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - 'slim_requirements.txt'
      - 'full_requirements.txt'
      - '.github/workflows/docker-build.yml'
  # Note: To save workflow time, let us NOT run the image build on PRs (mainly due to dependabot)
  # pull_request:
  #  branches:
  #    - main
  #  paths:
  #    - 'Dockerfile'
  #    - 'full_requirements.txt'
  #    - 'slim_requirements.txt'

env:
  REGISTRY: docker.io
  #IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME: devidealab/amml-python-base
  CACHE_IMAGE: docker.io/devidealab/amml-python-base-buildcache


jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps: # Add this job to test if secrets are available
      - name: Check if secrets are set
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "DOCKERHUB_USERNAME is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_TOKEN is not set"
            exit 1
          fi
          echo "All secrets are properly configured"
  # Each platform is built natively on its own runner and pushed by digest only,
  # the `merge` job below then combines the digests into one multi-arch tag.
  build:
    timeout-minutes: 200

    strategy:
      fail-fast: false
      matrix:
        # ROCm version is now officially un-supported
        hardware: ["cpu", "cuda"]
        target: ["slim", "full"]
        platform: ["linux/amd64", "linux/arm64"]

    runs-on: ${{ (matrix.platform == 'linux/arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare names
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "PRIMARY_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.hardware }}${{ (matrix.target == 'slim') && '-slim' || '' }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # - name: Log in to GitHub Container Registry
      #  uses: docker/login-action@v3
      #  with:
      #    registry: ${{ env.REGISTRY }}
      #    username: ${{ github.actor }}
      #    password: ${{ secrets.GITHUB_TOKEN }}

       # Optional: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The full target is published under both the un-suffixed name and a "-full" suffixed name.
          # metadata-action ignores empty list entries, so the second line is a no-op for the slim target.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.hardware }}${{ (matrix.target == 'slim') && '-slim' || '' }}
            ${{ (matrix.target == 'full') && format('{0}/{1}-{2}-full', env.REGISTRY, env.IMAGE_NAME, matrix.hardware) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # The build process for the ROCm image fails due to the large size of the image
      # That is why we remove this hopefully unnecessary large folder
      # https://github.com/orgs/community/discussions/25678#discussioncomment-5242449
      # https://github.com/docker/build-push-action/issues/968#issuecomment-1720992335
      - name: Free disk space on Ubuntu runner 🔧
        uses: kfir4444/free-disk-space@main
        with:
          # frees about 6 GB, warning: may remove required tools
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Build and push Docker image (by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            hardware=${{ matrix.hardware }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.PRIMARY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The cache is stored in a separate Docker Hub repository, as the CUDA layers exceed the 10 GB GHA cache limit.
          # Separate cache per platform, so that amd64 and arm64 do not overwrite each other.
          # Slim and full share the base layers, so the full build also reads the slim cache of the same platform.
          cache-from: |
            type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.hardware }}-slim-${{ env.PLATFORM_PAIR }}
            type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.hardware }}-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.hardware }}-${{ matrix.target }}-${{ env.PLATFORM_PAIR }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.hardware }}-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        hardware: ["cpu", "cuda"]
        target: ["slim", "full"]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.hardware }}-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The full target is published under both the un-suffixed name and a "-full" suffixed name.
          # metadata-action ignores empty list entries, so the second line is a no-op for the slim target.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.hardware }}${{ (matrix.target == 'slim') && '-slim' || '' }}
            ${{ (matrix.target == 'full') && format('{0}/{1}-{2}-full', env.REGISTRY, env.IMAGE_NAME, matrix.hardware) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        env:
          PRIMARY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.hardware }}${{ (matrix.target == 'slim') && '-slim' || '' }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${PRIMARY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ fromJSON(steps.meta.outputs.json).tags[0] }}